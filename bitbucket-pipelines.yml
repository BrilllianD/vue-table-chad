# CI for @brillliand/vue-table-chad.
#
# Bitbucket gates, GitHub publishes. This is the CI that has to be green:
# the remote it runs on is git@bitbucket.org:BrilllianD/vue-table-chad.git.
# .github/workflows/pages.yml is the only workflow on the GitHub mirror, it
# deploys the docs site and the demo to Pages by hand, and it checks nothing —
# one list of gates, in one place.
#
# One step, run on every pushed branch. The gating half is the same ritual the
# working agreement asks for by hand before each commit — typecheck, test,
# build — plus the bundle budget, which is the guard row virtualization landed
# without, and lint. Only `pnpm bench` is non-gating.

image: node:24

definitions:
  caches:
    # The pnpm *store*, not node_modules: pnpm's tree is symlinks into the
    # store, and a restored node_modules whose targets are gone is worse than
    # no cache at all.
    pnpm-store: $HOME/.local/share/pnpm/store

pipelines:
  default:
    - step:
        name: typecheck, test, build, budget, lint
        caches:
          - pnpm-store
        script:
          # `packageManager: pnpm@11.3.0` in package.json is the single place
          # the version is pinned; corepack reads it. The env var stops corepack
          # blocking on a download prompt there is no TTY to answer.
          - export COREPACK_ENABLE_DOWNLOAD_PROMPT=0
          - corepack enable
          - pnpm install --frozen-lockfile
          - pnpm typecheck
          - pnpm test
          - pnpm build
          - pnpm size
          # Gating since T4. It was `|| true` while 21 known-red errors stood,
          # which only taught everyone to scroll past it; the errors were each
          # decided — see CLAUDE.md's settled decisions — so a red lint is now
          # news again.
          - pnpm lint
          # The one non-gating step: bench numbers are
          # machine-specific, and a shared runner's absolute milliseconds are a
          # trend to read, not a threshold to fail. Compare against
          # bench/BASELINE.md by eye; the invariants that *can* be asserted are
          # in tests/invalidation.spec.ts, which the test step already ran.
          - pnpm bench || true
