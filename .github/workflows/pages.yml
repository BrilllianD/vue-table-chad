# Publishes the docs site and the demo to GitHub Pages.
#
# This publishes; it does not gate. The gating CI is bitbucket-pipelines.yml,
# which runs typecheck, test, build, the bundle budget and lint on every pushed
# branch — GitHub is a mirror plus the host, and duplicating those checks here
# would be two lists to keep in step for one answer.
#
# Every push to main republishes, and the manual trigger is kept beside it. The
# site tracks main rather than the releases: a docs fix that has landed and is
# not yet on the site is the failure mode that actually happens, and it is
# quieter than a stale page because nobody notices a page that is merely old.
#
# Nothing here gates, so a red commit publishes too — Bitbucket is what says a
# commit is good, and it says so after the fact either way.
#
# The manual run stays for republishing without a commit: Actions -> Deploy site
# -> Run workflow, against main. Repo Settings -> Pages must have Source set to
# GitHub Actions first, once.

name: Deploy site

on:
  push:
    branches: [main]
  workflow_dispatch:

# The three the deploy needs and nothing else: read the tree, write a Pages
# deployment, and mint the OIDC token deploy-pages exchanges for it.
permissions:
  contents: read
  pages: write
  id-token: write

# Never cancel a deploy in flight. A half-uploaded artifact is a broken site,
# and two runs queued behind each other cost a minute.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    # Job-wide rather than on the corepack step: `corepack enable` only writes
    # shims, and the download that would stop for a prompt happens later, on the
    # first actual pnpm invocation.
    env:
      COREPACK_ENABLE_DOWNLOAD_PROMPT: 0

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      # After setup-node, not before: corepack writes its shims beside the node
      # binary that runs it, so enabling it under the runner's preinstalled Node
      # puts pnpm somewhere this job's Node need not be looking. The version
      # comes from `packageManager` in package.json, the same pin the Bitbucket
      # pipeline reads.
      #
      # No `cache: pnpm` on setup-node, which reads its key by shelling out to
      # `pnpm store path` and so would have to run after this step, i.e. a second
      # setup-node purely to pass one input. The store is cached directly below
      # instead, which is the same saving with one action rather than two.
      - run: corepack enable

      # Worth it now the workflow runs per push rather than by hand a few times
      # a year. Keyed on the lockfile, with the loose prefix as a fallback so a
      # dependency bump warms from the previous store instead of from nothing.
      - id: store
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@v4
        with:
          path: ${{ steps.store.outputs.path }}
          key: ${{ runner.os }}-pnpm-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: ${{ runner.os }}-pnpm-

      - run: pnpm install --frozen-lockfile

      # Docs at the root, demo under demo/, both prefixed with the repo name —
      # see scripts/build-site.ts.
      - run: pnpm build:site

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs/.vitepress/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
